<!DOCTYPE html>
<html lang="Pt-Br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Class</title>
    <link rel="shortcut icon" href="assets/img/favicon-logo.png" type="image/x-icon">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Seu CSS Personalizado -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Input totalmente isolado e invisível -->
    <input type="checkbox" id="alternador-modo" class="d-none">

    <!-- Container que cobre 100% da página real -->
    <div class="site-wrapper d-flex flex-column justify-content-center align-items-center">

        <!-- Botão expandido: A label inteira agora reage ao clique perfeitamente -->
        <label for="alternador-modo" class="btn btn-outline-secondary position-fixed top-0 end-0 m-3 py-1 px-1 d-inline-block user-select-none z-3">
            <span class="texto-modo-escuro">🌙</span>
            <span class="texto-modo-claro d-none">☀️</span>
        </label>

        </div>

    </div>

</body>
</html>
