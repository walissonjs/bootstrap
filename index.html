<!DOCTYPE html>
<html lang="Pt-Br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Class</title>
    <link rel="shortcut icon" href="assets/img/favicon-logo.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Seu CSS Personalizado -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- O Truque do Checkbox: Um input invisível no topo -->
    <input type="checkbox" id="alternador-modo" class="d-none">

    <!-- Todo o conteúdo do site DEVE ficar dentro deste container que é irmão do input -->
    <div class="site-wrapper d-flex flex-column justify-content-center align-items-center vh-100 m-0">

        <!-- Botão estilizado com Bootstrap que ativa o input invisível -->
        <label for="alternador-modo" class="btn btn-outline-secondary mb-4 botao-tema">
            <span class="texto-modo-escuro">Ativar Modo Escuro</span>
            <span class="texto-modo-claro d-none">Ativar Modo Claro</span>
        </label>

        <!-- Conteúdo de Exemplo utilizando classes nativas do Bootstrap -->
        <div class="text-center p-4 border rounded shadow-sm">
            <h1 class="display-5 fw-bold">Bootstrap 5 + CSS Puro</h1>
            <p class="lead text-muted">Alternando temas sem utilizar JavaScript.</p>
            <button class="btn btn-primary">Botão Padrão</button>
        </div>

    </div>

</body>
</html>
